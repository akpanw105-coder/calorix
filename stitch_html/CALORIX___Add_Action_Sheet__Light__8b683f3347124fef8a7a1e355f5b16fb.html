  (function() {
    const backdrop = document.getElementById('modalBackdrop');
    const closeBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelModalBtn');
    const chips = document.querySelectorAll('.quick-chip');

    function dismissModal() {
      if (backdrop) {
        backdrop.classList.add('opacity-0');
        backdrop.classList.add('pointer-events-none');
        setTimeout(() => {
          if (history.length > 1) {
            history.back();
          }
        }, 220);
      }
    }

    if (closeBtn) closeBtn.addEventListener('click', dismissModal);
    if (cancelBtn) cancelBtn.addEventListener('click', dismissModal);

    chips.forEach(chip => {
      chip.addEventListener('click', function() {
        const originalText = this.innerHTML;
        this.innerHTML = '<span class="material-symbols-outlined text-[16px] text-emerald-600">check</span><span class="font-label-md text-label-md text-emerald-700">Logged</span>';
        setTimeout(() => {
          dismissModal();
        }, 400);
      });
    });
  })();
